function trPlan(){const d=Object.assign({o:'T1',d:'thin1',c:60},S.ui.draft.tr||{});

 const dE=S.env.find(e=>e.id===d.d&&e.suc===S.suc),dS=!dE&&SKU[d.d]?d.d:null;const c=+d.c||0;const err=[];
 if(!g)return {d,err:['Elige de dónde se toma el producto.']};
 const need=dS?c*SKU[dS].eq:c;const oAvail=oE?oE.cont:stock(oS)*SKU[oS].eq;
 if(need>oAvail)err.push(`No alcanza: se necesitan ${nf(need)} ${GRAN[g].u} y hay ${nf(oAvail)}.`);
 if(oS&&need%SKU[oS].eq)err.push(`La cantidad debe ser múltiplo de ${nf(SKU[oS].eq)} ${GRAN[g].u}.`);
 const emp=dS?Object.entries(SKU[dS].emp||{}).map(([k,n])=>({k,n:n*c,a:stock(k)})):[];emp.forEach(x=>{if(x.n>x.a)err.push(`Falta ${lc(SKU[x.k].n)}: se necesitan ${nf(x.n)} y hay ${nf(x.a)}.`);});
 if(dE&&dE.cont+need>dE.cap)err.push(`${dE.id} no tiene espacio: le caben ${nf(dE.cap-dE.cont)} ${GRAN[g].u}.`);
 if(dE&&dE.cont===0&&dE.ult&&dE.ult!==g)err.push(`${dE.id} está vacío y contuvo ${lc(GRAN[dE.ult].n)}: revisa que esté limpio.`);
 if(c<=0)err.push('Indica la cantidad.');
 if(dS&&c>0&&!Number.isInteger(c))err.push('La cantidad de piezas debe ser un número entero.');
 return {d,g,oE,oS,dE,dS,c,need,emp,err};}

 tlog(t,`Cobro de ${$f(m)} ${forma==='Efectivo'?'en efectivo':'por '+forma.toLowerCase()}${pp?', con pronto pago de '+$f(pp):''}`,por==='Administración'?ROLES.admin.u:por,h);}
function doEntrega(f,rej,u,h){const t=S.tk.find(x=>x.f===f);t.est='entregado';t.ent=0;const nr=Object.entries(rej||{}).filter(([k,r])=>r>0);tlog(t,nr.length?'Entregado; el cliente no aceptó '+nr.map(([k,r])=>nf(r)+' ('+SKU[k].n+')').join(' y '):'Entregado al cliente',u,h);

function stamp(){let n=0;S.q.timb.forEach(q=>{const u=uuid();n++;
 if(q.k==='fac'){const x=S.fac.find(f=>f.id===q.id);x.uuid=u;x.est='Vigente';const tt=S.tk.find(y=>y.f===x.ref);if(tt)tlog(tt,'Factura timbrada al restablecer la conexión');S.comp.filter(c=>c.fac===x.id).forEach(c=>c.facU=u);}
 if(q.k==='comp')S.comp.filter(c=>c.cu===q.id).forEach(c=>{c.cu2=u;c.est='Emitido';});
 if(q.k==='nc'){const x=S.nc.find(z=>z.id===q.id);x.uuid=u;}
 if(q.k==='glob'){const g=S.glob.find(z=>z.id===q.id);g.uuid=u;const x=S.fac.find(f=>f.id===q.id);if(x){x.uuid=u;x.est='Vigente';}}});
 S.comp.forEach(c=>{if(c.cu2){c.cu=c.cu2;delete c.cu2;}});S.q.timb=[];return n;}

 S.q[dev]=[];S.ui.syncing[dev]=false;save();render();toast(n?`Sincronización completa: ${n} registro${n>1?'s':''} enviado${n>1?'s':''}.`:'Señal recuperada.');},1500);}

 <div class="panel"><h3>Resumen</h3><div class="sum">${CFS.map(f=>`<span>${f}</span><span>${$f(corteSum(L,f))}</span>`).join('')}<span class="t">Total vendido</span><span class="t">${$f(tot)}</span></div>
 <div class="grid2" style="margin-top:.8rem">${F('Fondo de caja',`<input type="number" id="ccF" min="0" step=".5" value="${S.ccFondo==null?500:S.ccFondo}">`)}${F('Efectivo contado en caja','<input type="number" id="ccE" min="0" step=".5">')}</div>
 <p class="muted" style="font-size:.85rem">En caja debe haber el fondo más las ventas en efectivo: ${$f(r2((S.ccFondo==null?500:S.ccFondo)+corteSum(L,'Efectivo')))}.</p>${B('Cerrar caja','corte',{},'',!L.length)}</div></div>
 <div class="panel"><h3>Cortes anteriores</h3>${TB(['Hora','Usuario','Tickets#','Efectivo esperado#','Contado#','Diferencia#'],(S.cortes||[]).slice().reverse().map(c=>`<tr>${td(esc(c.h))}${td(esc(c.u))}${td(c.tks.length,1)}${td($f(c.esp),1)}${td($f(c.cont),1)}${td($d(c.dif),1)}</tr>`),'Todavía no hay cortes.')}</div>`;};
A.corte=()=>{const L=corteL();if(!L.length)return;const fondo=num('ccF'),cont=num('ccE');S.ccFondo=fondo;const esp=r2(fondo+corteSum(L,'Efectivo')),dif=r2(cont-esp);(S.cortes=S.cortes||[]).push({h:hhmm(),u:user(),tks:L.map(t=>t.f),esp,cont,dif});alog('Ventas','Corte de caja: esperado '+$f(esp)+', contado '+$f(cont)+(dif?', diferencia '+$d(dif):', sin diferencias'));toast(dif?'Caja cerrada con una diferencia de '+$d(dif)+'.':'Caja cerrada sin diferencias.');};
/* ---------- arranque ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;f(el.dataset,el,e);save();render();});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const f=CH[el.dataset.ch];if(!f)return;f(el.value,el);save();render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ui.modal){S.ui.modal=null;render();}});
load();Object.entries(S.xsku||{}).forEach(([k,o])=>addSku(k,o));(S.xprov||[]).forEach(p=>{if(!PROVS.find(x=>x.n===p.n))PROVS.push(p);});if(S.pOver)Object.entries(S.pOver).forEach(([kc,v])=>{SKU[kc.slice(0,-1)].p[kc.slice(-1)]=v;});S.ui.syncing={};render();window.addEventListener('beforeunload',save);setInterval(save,2000);
</script>
